# The default agent of this stack: answers from the knowledge store (agentic RAG) on the web console and on the chat
# platforms its connectors bring. Staff sign in on the dashboard with the account of plugin `web` (created on the
# first sign-in); the dashboard's server keeps that login in an httpOnly cookie and calls this agent with it.
# Secrets never go here: the model's API key is set on the dashboard and stored encrypted in the database.

[agent]
name = "rag"
tools = ["get_datetime"]
timezone = "Asia/Ho_Chi_Minh"
failure_reply = "Xin lỗi, hiện tôi chưa trả lời được. Bạn vui lòng thử lại sau ít phút."

[agent.variables]
# filled into {{...}} of SOUL.md and AGENTS.md when the profile loads (demo values, not a real clinic)
clinic_name = "Pema Clinic & Spa"
hotline = "1800 0000"

[prompt]
sections = ["identity", "rules", "tool_usage", "memory", "user_memory", "environment", "status"]

[context]
window_tokens = 128000
compact_at = 0.75
keep_recent_ratio = 0.20

[memory]
enabled = true
agent_chars = 2200
user_chars = 1375

[guards]
injection_scan = true
redact_secrets = true
warn_tool_results = true
max_parallel_tools = 4
max_tool_calls_per_step = 8

[model]
# set on the dashboard (model, base URL, key); these are only the defaults
provider = "openai-compatible"
model = ""
base_url = ""
timeout_s = 120

[loop]
# room for a few searches of the knowledge store, a read and the answer
max_steps = 10
max_output_tokens = 2048
max_turn_s = 300
repeat_thresholds = [3, 5, 8]
stop_after_repeats = 10
error_streak_remind = 3
error_streak_stop = 5
queue_mode = "steer"
queue_debounce_s = 0.8
queue_max_wait_s = 3.0
queue_max_batch = 20
# Zalo customers send a thought in pieces, a few seconds apart: wait for the rest before answering, and longer
# while the customer is heard typing (personal accounts report it). The test console keeps the short wait.
queue_wait_by_prefix = { "zalo-" = { debounce_s = 5.0, max_wait_s = 20.0 } }
queue_typing_hold_s = 6.0
queue_typing_max_wait_s = 30.0

[plugins]
# web: the dashboard's sign-in (one admin account, login tokens, API keys for the chat API);
# knowledge: the documents the agent answers from; jev: the judge that rates what a search found;
# skills: skills, rules and persona bound to the agent, to a chat plugin or to one account;
# conversations: keeps the conversations of the channels switched on in its page (all off until then);
# follow_up: writes once more to a customer whose one-to-one chat went quiet, as a case on the case engine (no
# channel until its setting "channels" names some, and only while cases_enabled is on);
# connectors: the chat platforms (Zalo...) that run as their own services and sign in with a key from its page
enabled = ["web", "knowledge", "jev", "skills", "conversations", "follow_up", "connectors"]
