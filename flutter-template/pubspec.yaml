name: pema_native_template
description: Pema Clinic and Care interactive native design template.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  http: ^1.5.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9
flutter:
  uses-material-design: true
  assets:
    - assets/pema-logo.png
    - assets/products.json
    - assets/patients.json
  fonts:
    - family: BeVietnam
      fonts:
        - asset: assets/be-vietnam-pro-regular.ttf
        - asset: assets/be-vietnam-pro-medium.ttf
          weight: 500
        - asset: assets/be-vietnam-pro-semibold.ttf
          weight: 600
        - asset: assets/be-vietnam-pro-bold.ttf
          weight: 700
