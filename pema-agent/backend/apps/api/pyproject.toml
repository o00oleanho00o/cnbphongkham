[project]
name = "pema-api"
version = "0.1.0"
description = "Pema clinic CRM: FastAPI app, clinic actions, the agent gateway (schema clinic.*)."
requires-python = ">=3.12"
# The agent (models, documents, web tools) lives in apps/agent: nothing of it is installed here.
dependencies = [
    "pema-contracts",
    "secret-cipher",
    # web + config
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.2",
    # auth and secrets
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    # zoneinfo on a slim image
    "tzdata>=2024.2",
]

[tool.uv.sources]
pema-contracts = { workspace = true }
secret-cipher = { workspace = true }

[project.scripts]
pema = "pema.cli:main"
pema-export-openapi = "pema.api.export_openapi:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pema"]
