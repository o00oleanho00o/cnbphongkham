# Development agent. Secrets never go here: the model's API key is set on the dashboard (or `agent model set
# --ask-key`) and stored encrypted in the database; the model and base URL set there override [model].
# Who the agent is lives in SOUL.md, how it works in AGENTS.md, bundled skills in skills/<name>/SKILL.md.
# The agent can read those files but never change them.

[agent]
name = "dev"
tools = ["get_datetime"]
timezone = "Asia/Ho_Chi_Minh"
# sent through a chat channel when a turn fails (model down, bad key); empty sends nothing
failure_reply = "Sorry, I cannot answer right now. Please try again in a few minutes."

[prompt]
# session sections form the frozen system prompt; turn/step sections go in the per-request context block
sections = ["identity", "rules", "tool_usage", "skills", "memory", "user_memory", "environment", "status"]

[context]
# older turns are summarised when a request would pass compact_at of the window left after the reply
window_tokens = 128000
compact_at = 0.75
keep_recent_ratio = 0.20

[memory]
# notes the agent keeps across sessions: its own and about each user
enabled = true
agent_chars = 2200
user_chars = 1375

[skills]
# bundled skills come from this folder; the agent may add its own with the skill tools
enabled = true
dir = "skills"

[guards]
# injection_scan blocks memory/skill writes that look like prompt injection; redact_secrets masks keys and
# secret env values in tool results; warn_tool_results flags results that read like instructions.
# Read-only tool calls in one step run in parallel (max_parallel_tools); calls past the cap are refused.
injection_scan = true
redact_secrets = true
warn_tool_results = true
max_parallel_tools = 4
max_tool_calls_per_step = 8

[model]
# provider: openai-compatible (OpenAI, DeepSeek, OpenRouter, ...) or anthropic; the dashboard overrides it
provider = "openai-compatible"
model = ""
base_url = ""
timeout_s = 120
# timeout_s: longest wait for the next piece of the model's stream; a stalled stream is retried
# reasoning: off | low | medium | high; unset keeps the provider default (DeepSeek thinks at "high", which is
# slow). dialect: "deepseek" or "openai"; unset guesses from base_url.
# reasoning = "off"

[loop]
max_steps = 6
max_output_tokens = 2048
# after this many seconds no new step starts and one last call answers
max_turn_s = 300
# max_turn_tokens = 200000  # input + output tokens of one turn; unset = no limit
# loop guard: the same tool call with the same arguments in a row earns a reminder at these counts and ends
# the turn's tool use at stop_after_repeats; failing tool calls in a row: a reminder, then a stop
repeat_thresholds = [3, 5, 8]
stop_after_repeats = 10
error_streak_remind = 3
error_streak_stop = 5
# a message that comes while the conversation's turn runs: followup = its own turn later; collect = after a
# quiet moment (queue_debounce_s, at most queue_max_wait_s) one person's waiting messages become one turn;
# steer = collect, and messages that come while the turn uses tools join it before its next model call
queue_mode = "steer"
queue_debounce_s = 0.8
queue_max_wait_s = 3.0
queue_max_batch = 20
# queue_by_channel = { http = "followup" }

[plugins]
# Plugins to load at start, found in apps/agent/plugins, this folder's plugins/ and the home's installed/.
# A listed plugin that fails to load stops the start. `agent plugins list --profile ...` shows them all.
# web: the dashboard's sign-in; without it nobody can call the gateway.
enabled = ["web", "calculate"]

[plugins.calculate]
precision = 10
