# The clinic's agent: staff sign in once on the clinic web, whose server calls this agent with a short token
# the clinic API signs (plugin sso). The agent has no dashboard or sign-in of its own here: its pages (overview,
# model, plugins, and the pages plugins ship) are shown by the clinic web under "Điều khiển agent".
# Secrets never go here: the model's API key is set on the dashboard and stored encrypted in the database.

[agent]
name = "clinic"
tools = ["get_datetime"]
timezone = "Asia/Ho_Chi_Minh"
failure_reply = "Xin lỗi, hiện tôi chưa trả lời được. Bạn vui lòng thử lại sau ít phút."
# every tool of the system may be called; tools that reach the internet are refused
allow_internet = false

[agent.variables]
# filled into {{...}} of SOUL.md and AGENTS.md when the profile loads (demo values, not a real clinic)
clinic_name = "Pema Clinic & Spa"
hotline = "1800 0000"

[prompt]
sections = ["identity", "rules", "tool_usage", "skills", "memory", "user_memory", "environment", "status"]

[context]
window_tokens = 128000
compact_at = 0.75
keep_recent_ratio = 0.20

[memory]
enabled = true
agent_chars = 2200
user_chars = 1375

[skills]
# skills, rules and persona come from the skills plugin (written on its pages), not from the core
enabled = false
dir = "skills"

[guards]
injection_scan = true
redact_secrets = true
warn_tool_results = true
max_parallel_tools = 4
max_tool_calls_per_step = 8

[model]
# set on the dashboard (model, base URL, key); these are only the defaults
provider = "openai-compatible"
model = ""
base_url = ""
timeout_s = 120

[loop]
# room for a few searches of the knowledge store, a read and the answer
max_steps = 10
max_output_tokens = 2048
max_turn_s = 300
repeat_thresholds = [3, 5, 8]
stop_after_repeats = 10
error_streak_remind = 3
error_streak_stop = 5
queue_mode = "steer"
queue_debounce_s = 0.8
queue_max_wait_s = 3.0
queue_max_batch = 20

[plugins]
# sso: the clinic web's staff (owner and manager get admin); knowledge: the documents the agent answers from;
# skills: skills, rules and persona bound to the agent, to a chat plugin or to one account
enabled = ["sso", "calculate", "knowledge", "skills"]

[plugins.sso]
issuer = "pema-clinic"
audience = "pema-agent"
jwks_url = "http://api:8000/api/v1/.well-known/jwks.json"

[plugins.calculate]
precision = 10
