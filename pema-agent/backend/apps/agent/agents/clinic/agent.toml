# The clinic's agent: staff sign in once on the clinic web, whose server calls this agent with a short token
# the clinic API signs (plugin sso). The agent has no dashboard or sign-in of its own here: its pages (overview,
# model, plugins, and the pages plugins ship) are shown by the clinic web under "Điều khiển agent".
# Secrets never go here: the model's API key is set on the dashboard and stored encrypted in the database.

[agent]
name = "clinic"
tools = ["get_datetime"]
timezone = "Asia/Ho_Chi_Minh"
failure_reply = "Xin lỗi, hiện tôi chưa trả lời được. Bạn vui lòng thử lại sau ít phút."

[agent.variables]
# filled into {{...}} of SOUL.md and AGENTS.md when the profile loads (demo values, not a real clinic)
clinic_name = "Pema Clinic & Spa"
hotline = "1800 0000"

[prompt]
sections = ["identity", "rules", "tool_usage", "memory", "user_memory", "environment", "status"]

[context]
window_tokens = 128000
compact_at = 0.75
keep_recent_ratio = 0.20

[memory]
enabled = true
agent_chars = 2200
user_chars = 1375

[guards]
injection_scan = true
redact_secrets = true
warn_tool_results = true
max_parallel_tools = 4
max_tool_calls_per_step = 8

[model]
# set on the dashboard (model, base URL, key); these are only the defaults
provider = "openai-compatible"
model = ""
base_url = ""
timeout_s = 120

[loop]
# room for a few searches of the knowledge store, a read and the answer
max_steps = 10
max_output_tokens = 2048
max_turn_s = 300
repeat_thresholds = [3, 5, 8]
stop_after_repeats = 10
error_streak_remind = 3
error_streak_stop = 5
queue_mode = "steer"
queue_debounce_s = 0.8
queue_max_wait_s = 3.0
queue_max_batch = 20
# Zalo customers send a thought in pieces, a few seconds apart: wait for the rest before answering, and longer
# while the customer is heard typing (personal accounts report it). The test console keeps the short wait.
queue_wait_by_prefix = { "zalo-" = { debounce_s = 5.0, max_wait_s = 20.0 } }
queue_typing_hold_s = 6.0
queue_typing_max_wait_s = 30.0

[plugins]
# sso: the clinic web's staff (owner and manager get admin); knowledge: the documents the agent answers from;
# skills: skills, rules and persona bound to the agent, to a chat plugin or to one account;
# conversations: keeps the conversations of the channels switched on in its page (all off until then);
# crm: free times, save the contact, book, show, confirm, move, cancel, for the person of the chat only, through
# crm-signer (which holds the key; the agent holds none: docs/PLAN-crm-plugin.md);
# follow_up: writes once more to a customer whose one-to-one chat went quiet, as a case on the case engine; it
# watches no channel until its setting "channels" names some, and runs only while cases_enabled is on
# (docs/PLAN-case-loop.md 7)
enabled = ["sso", "knowledge", "skills", "conversations", "jev", "crm", "follow_up", "connectors"]

[plugins.sso]
issuer = "pema-clinic"
audience = "pema-agent"
jwks_url = "http://api:8000/api/v1/.well-known/jwks.json"

[plugins.crm]
# crm-signer, never the API: the agent has no way into the CRM but this narrow, signed one (test T4)
base_url = "http://crm-signer:8090/agent-gateway"
# the CRM's PUBLIC keys, to check the events it sends to /v1/hooks/crm/events (aud pema-agent-events)
events_jwks_url = "http://api:8000/api/v1/.well-known/jwks.json"
# the reminder loop of the plugin (marks, quiet hours and the daily cap are its settings): a person with consent gets a
# message before a visit; off unless set here (docs/PLAN-crm-plugin.md step 6c). Each mark is a case on the case
# engine, so the agent setting cases_enabled must be on too (docs/PLAN-case-loop.md 6)
reminders_enabled = true
