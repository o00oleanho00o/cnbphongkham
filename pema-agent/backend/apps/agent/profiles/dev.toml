# Development profile. Secrets never go here: the API key is read from LLM_API_KEY.
# LLM_MODEL and LLM_BASE_URL override [model].model and [model].base_url.

[agent]
name = "dev"
system_prompt_file = "prompts/dev.md"
tools = ["get_datetime"]
timezone = "Asia/Ho_Chi_Minh"

[prompt]
# session sections form the frozen system prompt; turn/step sections go in the per-request context block
sections = ["identity", "tool_usage", "environment", "status"]

[model]
provider = "openai-compatible"
model = ""
base_url = ""
timeout_s = 120

[loop]
max_steps = 6
max_output_tokens = 2048
