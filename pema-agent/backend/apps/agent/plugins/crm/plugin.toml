name = "crm"
version = "0.1.0"
description = "Lets the clinic's agent see free times and save, book, show, confirm, move and cancel the visits of the person it chats with, through crm-signer (which holds the key; this plugin holds none). Who the person is comes from the chat, never from the model."
api = 1

[migrations]
dir = "migrations"
prefix = "crm_"

[user_config.base_url]
type = "string"
title = "crm-signer URL"
description = "Where crm-signer forwards the agent gateway, e.g. http://crm-signer:8090/agent-gateway. Never the API itself."
default = "http://crm-signer:8090/agent-gateway"

[user_config.timeout_s]
type = "integer"
title = "Timeout (seconds)"
description = "How long one call to the CRM may take (1-30)."
default = 8

[user_config.timezone]
type = "string"
title = "Time zone"
description = "The clinic's time zone: a time the model writes without an offset is taken in it."
default = "Asia/Ho_Chi_Minh"

[user_config.events_jwks_url]
type = "string"
title = "CRM public keys URL"
description = "Where the CRM publishes the public keys its events are signed with (JWKS). Public keys only: nothing here opens the CRM."
default = "http://api:8000/api/v1/.well-known/jwks.json"

[user_config.reminders_enabled]
type = "boolean"
title = "Reminders"
description = "Write to people who agreed, before their visits (marks below), in their one-to-one chat. Off until switched on."
default = false

[user_config.reminder_marks]
type = "string"
title = "Reminder marks"
description = "hours before the visit:minimum minutes left, comma separated. 24:360 = a day before, skipped when under 6 hours remain."
default = "24:360,3:30"

[user_config.quiet_hours]
type = "string"
title = "Quiet hours"
description = "No reminder goes out between these local times (HH:MM-HH:MM); one due then waits for the end."
default = "21:00-07:00"

[user_config.reminders_per_day]
type = "integer"
title = "Reminders per person per day"
description = "At most this many reminders to one person in one local day."
default = 2
