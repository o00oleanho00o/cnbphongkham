name = "knowledge"
version = "0.4.0"
description = "The knowledge store (Kho tri thức): documents the agent looks things up in with kb_search and kb_read. Add and check sources, teach it service names, try a search."
api = 1
# documents are uploaded to the admin routes
max_body_kb = 12288

[ui]
dir = "ui/dist"
entry = "client.js"

[migrations]
dir = "migrations"
prefix = "kb_"

[user_config.results]
type = "integer"
title = "Results"
description = "Chunks one search hands the agent (1-10)."
default = 6

[user_config.char_budget]
type = "integer"
title = "Character budget"
description = "Most characters of document text one search hands the agent."
default = 6000

[user_config.timezone]
type = "string"
title = "Time zone"
description = "The clinic's time zone: the day a question is asked on, for prices and rules in force that day."
default = "Asia/Ho_Chi_Minh"

[user_config.benchmark_mode]
type = "boolean"
title = "Benchmark mode"
description = "Accept challenge documents (old prices, drafts, attack tests) when measuring the agent. Off in normal use."
default = false

[user_config.embedding_base_url]
type = "string"
title = "Embedding address"
description = "OpenAI-compatible base URL of the embedding service (the key is entered on the Kho tri thức settings page)."
default = "https://platform.beeknoee.com/api/v1"

[user_config.embedding_model]
type = "string"
title = "Embedding model"
description = "The embedding model."
default = "qwen/qwen3-embedding-8b"

[user_config.embedding_dimensions]
type = "integer"
title = "Embedding dimensions"
description = "Dimensions asked for; vectors are cut and normalised to this many."
default = 1024

[user_config.embedding_query_prefix]
type = "string"
title = "Question prefix"
description = "Put before a question when it is embedded (Qwen3 wants an instruction)."
default = "Instruct: Given a question from a skin clinic's customer, retrieve the passages of the clinic's documents that answer it\nQuery: "

[user_config.embedding_document_prefix]
type = "string"
title = "Chunk prefix"
description = "Put before a chunk when it is embedded."
default = ""

[user_config.vector_min_similarity]
type = "number"
title = "Least similarity"
description = "Least cosine similarity (0-1) a vector candidate needs."
default = 0.35

[user_config.vector_timeout_s]
type = "number"
title = "Vector wait"
description = "Seconds a search waits for the vector of the question before it goes on with keywords only."
default = 10.0

[user_config.judge_timeout_s]
type = "number"
title = "Judge wait"
description = "Seconds a search waits for the judge (plugin jev) to rate the chunks it found, before it goes on with them unjudged."
default = 4.0

[user_config.catalog_max_docs]
type = "integer"
title = "Table of contents"
description = "Documents in force the agent sees listed (code and title) with every question; a larger store gets no list. 0 turns it off."
default = 40
