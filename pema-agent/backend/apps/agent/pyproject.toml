[project]
name = "agent-app"
version = "0.1.0"
description = "Runs the general-purpose agent from its folder: chat CLI, HTTP gateway, Postgres storage (schema agent_rt)."
requires-python = ">=3.12"
dependencies = [
    "agent-core",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "secret-cipher",
]

[tool.uv.sources]
agent-core = { workspace = true }
secret-cipher = { workspace = true }

[project.scripts]
agent = "agent_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_app"]
