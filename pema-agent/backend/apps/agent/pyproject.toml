[project]
name = "agent-app"
version = "0.1.0"
description = "Runs the general-purpose agent from a TOML profile: chat CLI."
requires-python = ">=3.12"
dependencies = ["agent-core"]

[tool.uv.sources]
agent-core = { workspace = true }

[project.scripts]
agent = "agent_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_app"]
