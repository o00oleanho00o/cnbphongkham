[project]
name = "crm-signer"
version = "0.1.0"
description = "Holds the key that signs the agent's calls to the CRM gateway; the agent process holds no CRM key."
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43",
]

[project.scripts]
crm-signer = "crm_signer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crm_signer"]
