[project]
name = "agent-core"
version = "0.1.0"
description = "General-purpose agent core: message model, model port, tool registry and turn loop. Knows nothing about a clinic or a channel."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.54",
    "anthropic>=1.11",
    "tzdata>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcore"]
