[project]
name = "pema-contracts"
version = "0.1.0"
description = "Pema CSKH agent: shared pydantic DTOs, ChannelPort and the scheduler/agent/policy/tool/knowledge/conversation/mcp ports, error codes."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pema_contracts"]
