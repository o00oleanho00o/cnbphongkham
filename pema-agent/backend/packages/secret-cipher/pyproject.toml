[project]
name = "secret-cipher"
version = "0.1.0"
description = "AES-256-GCM for secrets stored in a database, shared by the clinic app and the agent service."
requires-python = ">=3.12"
dependencies = ["cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secretcipher"]
