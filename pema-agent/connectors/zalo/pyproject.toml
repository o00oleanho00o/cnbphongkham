[project]
name = "zalo-connector"
version = "0.1.0"
description = "Zalo connector for the Pema agent: Zalo Bot, personal Zalo accounts (QR login through the Bun bridge), rich-text replies. Talks to the agent only through docs/CONNECTOR-PROTOCOL.md."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
]

[project.scripts]
zalo-connector = "zalo_connector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zalo_connector"]
