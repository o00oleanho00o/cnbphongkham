# Labelled synthetic cases for the care agent eval (package M, step M6).
#
# Every text is invented: no real patient, name, phone number or clinic record. Vietnamese, with and without
# diacritics. Labels follow PLAN-AI01-M section 6 (default matrix, TEMPORARY, awaiting the doctor):
#   depth     D1 administrative, D2 standard care, D3 mild expected symptom, D4 medical judgement, D5 red flag
#   action    answer | handoff   (what the skill `handoff` should decide with the default configuration)
#   skill     expected required_skill; default: medical for D4/D5, general otherwise
# Context fields (default in brackets): vip [false], verified [true], hour [10, local, Monday 2026-10-05],
#   procedure_hours_ago [none], complex_history, past_complaint, pending_doctor_work [false],
#   repeat_count [0], conf [0.9: confidence the oracle model reports], intent [none: what the oracle reports].
# Hand-off thresholds that matter when reading the labels (defaults): D4 and D5 always a person; VIP and
# "asks for a person" / upset / repeated / rejected answer from D2; unverified patient only D1; complex
# history, past complaint, work waiting for a doctor, <= 48 h after a procedure, outside 08:00-20:00 from D3;
# confidence below 0.6 always a person.

