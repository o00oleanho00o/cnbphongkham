# Override for "behind the reverse proxy": only Caddy publishes ports (80/443). The api and the frontend stop
# publishing their loopback ports and are reachable only on the compose networks (`expose`).
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.proxy.yml --env-file infra/.env \
#       --profile proxy up -d      
#
# Without this file (plain `up`, `--profile app`, `pnpm dev`) the ports stay on the loopback addresses
# PEMA_API_BIND / PEMA_FRONTEND_BIND: that is the development way, no proxy, no TLS, this machine only.
#
# `!reset` (Docker Compose 2.24+) empties the `ports` list of the base file instead of merging with it. Postgres
# and Redis keep their loopback ports (database tools on the host); set their *_BIND to 127.0.0.1 and block the
# ports in the host firewall if the machine has a public address, as the Ubuntu guide says.
services:
  api:
    ports: !reset []
    expose:
      - "8000"
  frontend:
    ports: !reset []
    expose:
      - "3000"
