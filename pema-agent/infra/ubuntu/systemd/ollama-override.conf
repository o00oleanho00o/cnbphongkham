# Drop-in for the native Ollama service. Install with:
#   sudo systemctl edit ollama        (paste this file's [Service] block), or
#   sudo install -D -m 0644 ollama-override.conf /etc/systemd/system/ollama.service.d/pema.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# OLLAMA_HOST=0.0.0.0 is only acceptable together with the firewall of HUONG-DAN-UBUNTU.md section 8
# (default deny incoming; allow tailscale0 and the Docker bridges to 11434). Ollama has NO authentication.
# If you cannot guarantee the firewall, set the Tailscale IP of this machine here instead (100.x.y.z), and
# let Docker reach it through that address.
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
# Keep the chat and embedding models resident: the first token after a cold load takes many seconds.
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# Two conversations at once. Each parallel slot multiplies the KV cache (VRAM budget in the guide, section 5).
Environment="OLLAMA_NUM_PARALLEL=2"
# Context per request; the agent loop budgets context by tokens (D1). 16k fits next to bge-m3 on 12 GB.
Environment="OLLAMA_CONTEXT_LENGTH=16384"
# Flash attention + 8-bit KV cache roughly halve KV memory. Verify the answers on the evals before keeping it.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
