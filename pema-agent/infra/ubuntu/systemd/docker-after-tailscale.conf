# Only needed when a published port is bound to the machine's Tailscale IP (PEMA_PG_BIND=100.x.y.z and so on):
# Docker must start after the tailscale0 interface exists, otherwise the container fails to bind at boot.
#   sudo install -D -m 0644 docker-after-tailscale.conf /etc/systemd/system/docker.service.d/after-tailscale.conf
#   sudo systemctl daemon-reload
[Unit]
After=tailscaled.service network-online.target
Wants=tailscaled.service network-online.target
