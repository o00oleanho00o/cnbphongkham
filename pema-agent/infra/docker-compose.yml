  #     PEMA_EMBED_MODEL_PULL: ${PEMA_EMBED_MODEL_PULL:-bge-m3}
  #     OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
  #   # Also creates the short alias `pema-chat` with an explicit num_ctx: without it Ollama loads the GGUF's own
  #   # (very large) context and spills layers to the CPU on a 12 GB card (measured, see the Ubuntu guide).
  #   entrypoint:
  #     - /bin/sh
  #     - -c
  #     - |
  #       set -e
  #       ollama pull "$$PEMA_LLM_MODEL_PULL"
  #       ollama pull "$$PEMA_EMBED_MODEL_PULL"
  #       { echo "FROM $$PEMA_LLM_MODEL_PULL"; echo "PARAMETER num_ctx $$OLLAMA_CONTEXT_LENGTH"; } > /tmp/Modelfile
  #       ollama create pema-chat -f /tmp/Modelfile

# `default` joins postgres, redis, migrate and everything else (unchanged). `edge` is the only
# network Caddy is on: api and frontend are on both, nothing else is on it. Its fixed subnet lets the API name the
# proxy by address (PEMA_TRUSTED_PROXIES). Docker hands out the other containers' addresses only from `ip_range`
# (the upper half), so the fixed address of Caddy (`.2`) can never be taken by api or frontend, whatever order they
# start in. Change PEMA_PROXY_SUBNET, PEMA_PROXY_IP_RANGE and PEMA_PROXY_IP together if it collides with a network
# of yours; the IP must be inside the subnet and outside the range.
networks:
  edge:
    ipam:
      config:
        - subnet: ${PEMA_PROXY_SUBNET:-172.29.80.0/24}
          ip_range: ${PEMA_PROXY_IP_RANGE:-172.29.80.128/25}

volumes:
  pg-data:
  redis-data:
  pema-data:
  agent-home:
  caddy-data:
  caddy-config:
  # ollama-models:  # TẠM TẮT LLM LOCAL (2026-10-02)
