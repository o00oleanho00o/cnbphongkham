  #   # (very large) context and spills layers to the CPU on a 12 GB card (measured, see the Ubuntu guide).
  #   entrypoint:
  #     - /bin/sh
  #     - -c
  #     - |
  #       set -e
  #       ollama pull "$$PEMA_LLM_MODEL_PULL"
