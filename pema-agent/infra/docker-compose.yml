# Agent stack: postgres (database pema_agent), agent-migrate (one-shot), agent, egress, zalo (the Zalo connector) and the
# dashboard (frontend). Staff sign in on the dashboard with the agent's own account (plugin web, created on the first
# sign-in); its server keeps that login in an httpOnly cookie and calls the agent (/agent/...) and the connectors
# (/connectors/<name>/...) with it. The CRM is a separate product (branch split/crm).
#
#   default (no profile)  postgres, agent-migrate, agent (profile agents/rag), egress, zalo, frontend
#   profile proxy         Caddy reverse proxy (TLS, security headers) in front of the dashboard. The only service that
#                         publishes 80/443. Run it with the override file docker-compose.proxy.yml, which turns the
#                         loopback port of the frontend into `expose` (see infra/README.md, "Reverse proxy").
#   profile crm           crm-signer, for a stack whose agent talks to a CRM (plugin crm, profile agents/clinic, and
#                         CRM_SIGNER_UPSTREAM set to that CRM's /api/v1/agent-gateway).
#   profile ollama        TẠM TẮT LLM LOCAL (2026-10-02): the `ollama` and `ollama-pull` services are commented out
#                         at the end of this file. Ollama with an NVIDIA GPU, or natively on the GPU PC
#                         (see infra/ubuntu/HUONG-DAN-UBUNTU.md).
#
# Run from pema-agent/ (the Makefile does this):
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d
#
# Network exposure: every published port binds to a loopback address by default. Change PEMA_*_BIND to a
# Tailscale IP to reach a service from the other machine; never to 0.0.0.0 on a machine with a public IP.
# (Docker publishes ports around ufw, so the bind address is the control that counts.)
name: rag-agent

x-agent-build: &agent-build
  context: ..
  dockerfile: infra/docker/agent.Dockerfile

x-signer-build: &signer-build
  context: ..
  dockerfile: infra/docker/crm-signer.Dockerfile

x-egress-build: &egress-build
  context: ..
  dockerfile: infra/docker/egress.Dockerfile

services:
  postgres:
    image: pgvector/pgvector:${PEMA_PGVECTOR_TAG:-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PEMA_PG_SUPERUSER_PASSWORD:?set it in infra/.env (see .env.example)}
      POSTGRES_DB: pema_agent
      # data checksums catch silent disk corruption (relevant on a single clinic PC); scram for every TCP login.
      # The local socket inside the container stays `trust` (image default): whoever can `docker exec` is
      # already root on the host, and the backup/restore scripts rely on it.
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    command:
      - postgres
      - -c
      - shared_buffers=${PEMA_PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PEMA_PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - max_connections=100
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "${PEMA_PG_BIND:-127.0.0.1}:${PEMA_PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pema_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: the agent's runtime role (password from .env, CONNECT granted even with the hardened database), then
  # its own migrations (schema agent_rt, own version table) as the owner role.
  agent-migrate:
    build: *agent-build
    image: pema-agent-agent:${PEMA_IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # the agent's own database (bootstrap-role creates it when missing)
      AGENT_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:${PEMA_PG_SUPERUSER_PASSWORD:?set it in infra/.env}@postgres:5432/pema_agent
      AGENT_RT_APP_PASSWORD: ${PEMA_AGENT_RT_APP_PASSWORD:-}
    # then the tables of plugins that keep their own ([migrations] in plugin.toml)
    command: ["sh", "-c", "agent db bootstrap-role && alembic -c alembic.ini upgrade head && agent db migrate-plugins"]

  # The agent (profile agents/rag). Its only setting from here is the database. Chat platforms are not in it: the
  # connector services (zalo) talk to it through the connector protocol. The frontend reaches it at http://agent:8088.
  agent:
    build: *agent-build
    image: pema-agent-agent:${PEMA_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      egress:
        condition: service_started
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://agent_rt_app:${PEMA_AGENT_RT_APP_PASSWORD:-}@postgres:5432/pema_agent
      # The model, embedding, TypeSafe and Zalo Bot clients go out through egress, which logs every destination
      # (phase 1: nothing blocked). web_search/web_fetch (netguard) still go out directly.
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,crm-signer,postgres,frontend,agent,zalo
    command: ["agent", "serve", "--profile", "agents/rag", "--home", "/data", "--host", "0.0.0.0", "--port", "8088"]
    # Only the compose network reaches it (the frontend, as http://agent:8088). To look at it from the host, use
    # `docker compose exec agent ...` or add a `ports` entry in a local override file.
    expose:
      - "8088"
    volumes:
      - agent-home:/data
    # Hardened (docs/PLAN-crm-plugin.md 3.10b, test T9): it talks with people outside, so it may one day be talked
    # into anything; then it can write only its own /data (plugins and their data) and /tmp
    # (pip while an admin installs a plugin), and gains no privilege.
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The Zalo connector (docs/PLAN-zalo-service.md, docs/CONNECTOR-PROTOCOL.md): its own service and image, built from
  # connectors/zalo/ alone (no code of backend/). It talks to the agent only through the connector protocol, signed
  # with CONNECTOR_KEY: issue the key on the agent's Connectors page (Điều khiển agent > Connectors > Thêm), paste it
  # into infra/.env as ZALO_CONNECTOR_KEY, then `docker compose up -d zalo`. Empty key: it idles and logs that it has
  # none. Zalo accounts, sealed tokens and the inbound outbox are in the zalo-data volume (back it up: backup-postgres.sh).
  # Staff reach its pages through the dashboard (/connectors/zalo, PEMA_CONNECTOR_URLS). Internal only.
  zalo:
    build:
      context: ../connectors/zalo
      dockerfile: Dockerfile
    image: pema-agent-zalo:${PEMA_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      AGENT_URL: http://agent:8088
      CALLBACK_URL: http://zalo:8089
      CONNECTOR_NAME: zalo
      CONNECTOR_KEY: ${ZALO_CONNECTOR_KEY:-}
      # Seals the Zalo tokens kept in /data/zalo.db. Lose it and every token must be entered again.
      ZALO_SECRET_KEY: ${PEMA_ZALO_SECRET_KEY:?set it in infra/.env (see .env.example)}
      # Its admin pages accept the agent's dashboard logins, checked by the agent (CRM_JWKS_URL unset). A stack with a
      # CRM sets CRM_JWKS_URL (with SSO_ISSUER, SSO_AUDIENCE) to accept the CRM's staff tokens instead.
      # Webhook mode of Zalo Bot; empty = long polling. Needs a proxy route to /v1/hooks/zalo/bot/<account> (README).
      PUBLIC_URL: ${ZALO_PUBLIC_URL:-}
      # Zalo goes out through egress like the agent's clients; the stack's own services are not proxied.
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,agent,zalo,postgres,frontend
    depends_on:
      egress:
        condition: service_started
    expose:
      - "8089"
    volumes:
      - zalo-data:/data
    # Hardened like the agent: it talks with people outside, so it writes only its own /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8089/ready', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The only holder of the key that signs the agent's calls to the CRM gateway (docs/PLAN-crm-plugin.md 3.9). The
  # agent calls it at http://crm-signer:8090/agent-gateway/... without any credential; it signs one short token per
  # call, for exactly the one of the 8 routes asked for, and forwards to the API. Internal only. Make the key once:
  #   docker compose --profile crm run --rm crm-signer crm-signer keygen   -> give the printed public key to the CRM
  crm-signer:
    profiles: ["crm"]
    build: *signer-build
    image: pema-agent-crm-signer:${PEMA_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # the CRM's gateway, e.g. https://crm.example/api/v1/agent-gateway (no CRM in this stack)
      CRM_SIGNER_UPSTREAM: ${CRM_SIGNER_UPSTREAM:-}
    expose:
      - "8090"
    volumes:
      - crm-signer-keys:/keys
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The agent's way out to the internet (docs/PLAN-crm-plugin.md 3.10c): Squid, phase 1 LOGS every destination and
  # blocks none (`docker compose logs egress`: time, client, result, bytes, method, host). Read the logs into the
  # list of destinations the agent really needs; phase 2 allows only that list. Internal only.
  egress:
    build: *egress-build
    image: pema-agent-egress:${PEMA_IMAGE_TAG:-local}
    restart: unless-stopped
    expose:
      - "3128"
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /var/run/squid:size=1m
      - /var/log/squid:size=1m
      - /var/spool/squid:size=1m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    image: pema-agent-frontend:${PEMA_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      agent:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Where the dashboard server forwards /agent/v1 and /agent/ui, and signs staff in (/api/v1/auth/...). Read on
      # every request (route handler), not at build time: change it here and `docker compose up -d frontend`.
      PEMA_AGENT_INTERNAL_URL: ${PEMA_AGENT_INTERNAL_URL:-http://agent:8088}
      # Where the server forwards /connectors/<name> (name=url, comma separated). Read on every request.
      PEMA_CONNECTOR_URLS: ${PEMA_CONNECTOR_URLS:-zalo=http://zalo:8089}
      # The login cookie is Secure (browsers send it only over https; localhost counts as secure). Set false ONLY for
      # plain HTTP over a private network (PEMA_PROXY_TLS=off), or the sign-in loops.
      PEMA_SESSION_COOKIE_SECURE: ${PEMA_SESSION_COOKIE_SECURE:-true}
    networks:
      - default
      - edge
    ports:
      - "${PEMA_FRONTEND_BIND:-127.0.0.1}:${PEMA_FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # The one public door (TLS, security headers, body ceiling). Attached ONLY to `edge`, where only the frontend is,
  # so it cannot reach Postgres, the agent or the Zalo connector even by mistake. Config: infra/caddy/ (the TLS mode
  # file is chosen by PEMA_PROXY_TLS: auto | internal | off).
  caddy:
    profiles: ["proxy"]
    image: caddy:${PEMA_CADDY_TAG:-2-alpine}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      PEMA_PUBLIC_DOMAIN: ${PEMA_PUBLIC_DOMAIN:-localhost}
    networks:
      edge:
        ipv4_address: ${PEMA_PROXY_IP:-172.29.80.2}
    # Loopback by default, like every other port. A public site needs PEMA_PROXY_BIND=0.0.0.0 (or the public IP):
    # the certificate challenge and the visitors must reach 80 and 443.
    ports:
      - "${PEMA_PROXY_BIND:-127.0.0.1}:${PEMA_PROXY_HTTP_PORT:-80}:80"
      - "${PEMA_PROXY_BIND:-127.0.0.1}:${PEMA_PROXY_HTTPS_PORT:-443}:443"
      - "${PEMA_PROXY_BIND:-127.0.0.1}:${PEMA_PROXY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/modes/${PEMA_PROXY_TLS:-auto}.caddy:/etc/caddy/mode.caddy:ro
      # certificates and the local CA: losing them means a new certificate request (rate limited by the CA)
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # TẠM TẮT LLM LOCAL (2026-10-02): local LLM services. Re-enable: remove the leading `# ` of this block and
  # of the `ollama-models` volume, then `make up-ollama`.
  # ollama:
  #   profiles: ["ollama"]
  #   image: ollama/ollama:${PEMA_OLLAMA_TAG:-latest}
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_HOST: 0.0.0.0:11434
  #     OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
  #     OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
  #     OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
  #     OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
  #     OLLAMA_FLASH_ATTENTION: "1"
  #     OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
  #   # Needs the NVIDIA Container Toolkit on the host (see the Ubuntu guide). Without a GPU, drop this block.
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: all
  #             capabilities: [gpu]
  #   ports:
  #     - "${PEMA_OLLAMA_BIND:-127.0.0.1}:${PEMA_OLLAMA_PORT:-11434}:11434"
  #   volumes:
  #     - ollama-models:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 10
  #     start_period: 20s
  #
  # # One-shot: download the chat and embedding models into the ollama volume.
  # ollama-pull:
  #   profiles: ["ollama"]
  #   image: ollama/ollama:${PEMA_OLLAMA_TAG:-latest}
  #   restart: "no"
  #   depends_on:
  #     ollama:
  #       condition: service_healthy
  #   environment:
  #     OLLAMA_HOST: http://ollama:11434
  #     PEMA_LLM_MODEL_PULL: ${PEMA_LLM_MODEL_PULL:-hf.co/Qwen/Qwen3-8B-GGUF:Q5_K_M}
  #     PEMA_EMBED_MODEL_PULL: ${PEMA_EMBED_MODEL_PULL:-bge-m3}
  #     OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
  #   # Also creates the short alias `pema-chat` with an explicit num_ctx: without it Ollama loads the GGUF's own
  #   # (very large) context and spills layers to the CPU on a 12 GB card (measured, see the Ubuntu guide).
  #   entrypoint:
  #     - /bin/sh
  #     - -c
  #     - |
  #       set -e
  #       ollama pull "$$PEMA_LLM_MODEL_PULL"
  #       ollama pull "$$PEMA_EMBED_MODEL_PULL"
  #       { echo "FROM $$PEMA_LLM_MODEL_PULL"; echo "PARAMETER num_ctx $$OLLAMA_CONTEXT_LENGTH"; } > /tmp/Modelfile
  #       ollama create pema-chat -f /tmp/Modelfile

# `default` joins every service. `edge` is the only network Caddy is on, and the frontend is the only other service on
# it. Docker hands out the other containers' addresses only from `ip_range` (the upper half), so the fixed address of
# Caddy (`.2`) can never be taken, whatever order they start in. Change PEMA_PROXY_SUBNET, PEMA_PROXY_IP_RANGE and
# PEMA_PROXY_IP together if it collides with a network of yours; the IP must be inside the subnet and outside the range.
networks:
  edge:
    ipam:
      config:
        - subnet: ${PEMA_PROXY_SUBNET:-172.29.80.0/24}
          ip_range: ${PEMA_PROXY_IP_RANGE:-172.29.80.128/25}

volumes:
  pg-data:
  agent-home:
  zalo-data:
  crm-signer-keys:
  caddy-data:
  caddy-config:
  # ollama-models:  # TẠM TẮT LLM LOCAL (2026-10-02)
