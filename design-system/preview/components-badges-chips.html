<style>
body{margin:0;padding:20px;background:var(--color-surface)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.sw{width:88px}.sw i{display:block;height:48px;border-radius:var(--radius-tile);border:1px solid var(--color-line)}
.sw b{display:block;margin-top:6px;font-size:var(--text-label);color:var(--color-ink)}.sw small{font-size:var(--text-micro);color:var(--color-ink-soft)}
.bt{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--radius-control);border:1px solid transparent;font:600 var(--text-small) var(--font-family-ui),sans-serif}
.bd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-line);border-radius:var(--radius-pill);padding:2px 10px;font-size:var(--text-label);font-weight:500}
.bd:before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px}

</style>

<body>
<div class="" style="background:var(--color-canvas);padding:12px;border-radius:var(--radius-tile);margin-bottom:10px"><div class="row"><span class="bd" style="background:var(--color-success-soft);border-color:var(--color-success-line);color:var(--color-success)">success</span><span class="bd" style="background:var(--color-info-soft);border-color:var(--color-info-line);color:var(--color-info)">info</span><span class="bd" style="background:var(--color-warning-soft);border-color:var(--color-warning-line);color:var(--color-warning)">warning</span><span class="bd" style="background:var(--color-danger-soft);border-color:var(--color-danger-line);color:var(--color-danger)">danger</span><span class="bd" style="background:var(--color-tile);color:var(--color-ink-soft)">neutral</span><span class="bd" style="background:var(--color-brand-50);border-color:var(--color-brand-100);color:var(--color-brand-700)">brand</span></div></div><div class="row"><span class="bt" style="min-height:36px;border-radius:var(--radius-pill);background:var(--color-brand-500);color:var(--color-surface);font-weight:500">Tất cả 12</span><span class="bt" style="min-height:36px;border-radius:var(--radius-pill);border-color:var(--color-line);color:var(--color-ink-soft);font-weight:500">Hôm nay 4</span><span class="bt" style="min-height:36px;border-radius:var(--radius-pill);border-color:var(--color-line);color:var(--color-ink-soft);font-weight:500;opacity:.5">Đã hủy</span></div>
