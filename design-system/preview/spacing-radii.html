<title>Radius</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">

<style>
body{margin:0;padding:20px;background:var(--color-surface)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.sw{width:88px}.sw i{display:block;height:48px;border-radius:var(--radius-tile);border:1px solid var(--color-line)}
.sw b{display:block;margin-top:6px;font-size:var(--text-label);color:var(--color-ink)}.sw small{font-size:var(--text-micro);color:var(--color-ink-soft)}
.bt{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:var(--radius-control);border:1px solid transparent;font:600 var(--text-small) var(--font-family-ui),sans-serif}
.bd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-line);border-radius:var(--radius-pill);padding:2px 10px;font-size:var(--text-label);font-weight:500}
.bd:before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor}
.card{background:var(--color-surface);border:1px solid var(--color-line);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px}

</style>
</head>
<body>
<div class="row"><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-field);height:64px"></i><b>field</b><small>9px</small></div><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-control);height:64px"></i><b>control</b><small>10px</small></div><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-tile);height:64px"></i><b>tile</b><small>12px</small></div><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-card);height:64px"></i><b>card</b><small>14px</small></div><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-modal);height:64px"></i><b>modal</b><small>20px</small></div><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-hero);height:64px"></i><b>hero</b><small>24px</small></div><div class="sw"><i style="background:var(--color-tile);border-radius:var(--radius-pill);height:64px"></i><b>pill</b><small>999px</small></div></div>
</body>
