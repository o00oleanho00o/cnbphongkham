services:
  pema-prototype:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pema-prototype
    ports:
      - "4173:4173"
    restart: unless-stopped

  pema-design-viewer:
    build:
      context: .
      dockerfile: design-viewer/Dockerfile
    container_name: pema-design-viewer
    ports:
      - "4190:80"
    restart: unless-stopped
