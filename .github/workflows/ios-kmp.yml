name: iOS build (pema-kmp)

on:
  workflow_dispatch:
  push:
    paths:
      - "pema-kmp/**"
      - ".github/workflows/ios-kmp.yml"

concurrency:
  group: ios-kmp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pema-kmp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('pema-kmp/gradle/libs.versions.toml', 'pema-kmp/build-logic/**/*.kts') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          # The runner has 7 GB RAM; leave room for the Kotlin/Native linker.
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g" >> ~/.gradle/gradle.properties

      - name: Generate Xcode project
        working-directory: pema-kmp/iosApp
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (device, unsigned)
        working-directory: pema-kmp/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -target iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        working-directory: pema-kmp/iosApp/build
        run: |
          mkdir -p Payload
          cp -R Release-iphoneos/Pema.app Payload/
          zip -qry Pema-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Pema-unsigned-ipa
          path: pema-kmp/iosApp/build/Pema-unsigned.ipa
          retention-days: 14
