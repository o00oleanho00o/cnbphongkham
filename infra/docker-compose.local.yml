# Override used ONLY by the root docker-compose.yml (`include`), to start the whole stack with one command.
# infra/docker-compose.yml on its own (make up, make up-proxy) is unchanged.
#
#   - every service of the default stack starts (postgres, agent-migrate, agent, egress, zalo, frontend);
#   - sign in at http://localhost:3000: the first sign-in creates the agent's admin account (plugin web);
#   - nothing restarts by itself: a container runs only after `docker compose up`, never when Docker starts with
#     Windows (restart: "no"); `docker compose stop` ends it for good.
services:
  postgres:
    restart: "no"

  agent:
    restart: "no"

  zalo:
    restart: "no"

  egress:
    restart: "no"

  frontend:
    restart: "no"
