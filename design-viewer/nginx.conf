server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # No SPA fallback: a missing .dc.html must 404, not load the viewer inside its own iframe.
    location / {
        try_files $uri $uri/ =404;
    }

    # Pages and the dc runtime change on every rebuild; always revalidate.
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Vite output is content-hashed; ^~ keeps the .js rule above from matching here.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
